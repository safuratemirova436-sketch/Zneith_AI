<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenith AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0f19; color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; }
        .glass { background: rgba(17, 24, 39, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="glass px-6 py-4 flex justify-between items-center z-10">
        <div class="flex items-center space-x-2">
            <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white shadow-lg">Z</div>
            <span class="font-bold text-lg text-indigo-400">Zenith AI</span>
        </div>
        <button id="btn-settings" class="px-3 py-1.5 rounded-lg bg-gray-800 hover:bg-gray-700 text-sm text-gray-200 cursor-pointer">⚙️ Настройки API</button>
    </header>

    <!-- Chat Area -->
    <main id="messages-container" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-3xl w-full mx-auto">
        <div class="flex justify-start">
            <div class="glass rounded-2xl px-4 py-3 text-sm text-gray-200">
                Здравствуйте! Нажмите на кнопку «⚙️ Настройки API» вверху, укажите ваш Gemini API ключ, и я буду готов ответить на любые вопросы.
            </div>
        </div>
    </main>

    <!-- Input Area -->
    <div class="p-4 glass border-t border-gray-800">
        <div class="max-w-3xl mx-auto flex space-x-2">
            <input type="text" id="chat-input" placeholder="Введите сообщение..." class="flex-1 bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500 text-sm">
            <button id="btn-send" class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 rounded-xl font-medium cursor-pointer transition">Отправить</button>
        </div>
    </div>

    <!-- Modal Settings -->
    <div id="modal-settings" class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 hidden z-50">
        <div class="glass max-w-md w-full p-6 rounded-2xl space-y-4 bg-gray-900">
            <h3 class="text-lg font-semibold text-white">Введите API Ключ</h3>
            <p class="text-xs text-gray-400">Ключ можно скопировать в <a href="https://aistudio.google.com/app/apikey" target="_blank" class="text-indigo-400 underline">Google AI Studio</a>.</p>
            <input type="password" id="input-api-key" placeholder="AIzaSy..." class="w-full bg-gray-950 border border-gray-700 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-indigo-500">
            <div class="flex justify-end space-x-2 pt-2">
                <button id="btn-save-settings" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-sm font-medium cursor-pointer">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- ПОЛНЫЙ СКРИПТ ПРИЛОЖЕНИЯ -->
    <script>
        const apiKeyInput = document.getElementById('input-api-key');
        const modalSettings = document.getElementById('modal-settings');
        const chatInput = document.getElementById('chat-input');
        const btnSend = document.getElementById('btn-send');
        const messagesContainer = document.getElementById('messages-container');

        let apiKey = localStorage.getItem('zenith_api_key') || '';
        apiKeyInput.value = apiKey;

        document.getElementById('btn-settings').onclick = () => modalSettings.classList.remove('hidden');
        
        document.getElementById('btn-save-settings').onclick = () => {
            apiKey = apiKeyInput.value.trim();
            localStorage.setItem('zenith_api_key', apiKey);
            modalSettings.classList.add('hidden');
            alert('Ключ успешно сохранен!');
        };

        // Список моделей для фоллбека на случай изменения версий Google API
        const MODELS = ['gemini-2.5-flash', 'gemini-2.0-flash', 'gemini-1.5-flash-latest'];

        async function fetchGeminiResponse(text) {
            let lastError = null;
            for (const model of MODELS) {
                try {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: text }] }] })
                    });
                    const data = await res.json();
                    if (res.ok && data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
                        return data.candidates[0].content.parts[0].text;
                    }
                    if (data.error) lastError = data.error.message;
                } catch (e) {
                    lastError = e.message;
                }
            }
            throw new Error(lastError || 'Не удалось получить ответ от моделей Gemini.');
        }

        async function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;

            if (!apiKey) {
                modalSettings.classList.remove('hidden');
                alert('Сначала укажите API ключ в настройках!');
                return;
            }

            appendMessage('user', text);
            chatInput.value = '';

            const loadingId = appendMessage('assistant', 'Zenith AI думает...');

            try {
                const reply = await fetchGeminiResponse(text);
                removeMessage(loadingId);
                appendMessage('assistant', reply);
            } catch (err) {
                removeMessage(loadingId);
                appendMessage('assistant', 'Ошибка: ' + err.message);
            }
        }

        let msgCounter = 0;
        function appendMessage(role, text) {
            const id = 'msg-' + (++msgCounter);
            const div = document.createElement('div');
            div.id = id;
            div.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'}`;
            
            const bubble = document.createElement('div');
            bubble.className = `max-w-[80%] rounded-2xl px-4 py-3 text-sm ${role === 'user' ? 'bg-indigo-600 text-white' : 'glass text-gray-200'}`;
            bubble.innerText = text;

            div.appendChild(bubble);
            messagesContainer.appendChild(div);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
            return id;
        }

        function removeMessage(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        btnSend.onclick = sendMessage;
        chatInput.onkeydown = (e) => {
            if (e.key === 'Enter') sendMessage();
        };
    </script>
</body>
</html>
