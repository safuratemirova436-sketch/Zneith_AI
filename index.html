<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenith AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background: #090d16; 
            color: #e6edf3; 
            font-family: system-ui, -apple-system, sans-serif;
        }
        /* Стильный скроллбар */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0d1117; }
        ::-webkit-scrollbar-thumb { background: #1f293d; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #374151; }

        .glass { 
            background: rgba(17, 24, 39, 0.75); 
            backdrop-filter: blur(16px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
        }
        .chat-active { 
            background: rgba(99, 102, 241, 0.2) !important; 
            border: 1px solid rgba(99, 102, 241, 0.5) !important; 
        }
        .chat-item:hover .btn-delete-chat { opacity: 1; }
        
        /* Анимированный декор на фоне */
        .glow-bg {
            position: absolute;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            top: 20%;
            left: 30%;
            pointer-events: none;
            z-index: 0;
        }
    </style>
</head>
<body class="h-screen flex flex-col justify-between overflow-hidden relative">

    <div class="glow-bg"></div>

    <!-- Выдвижная боковая панель -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/70 z-40 hidden backdrop-blur-sm transition-opacity"></div>
    <aside id="sidebar" class="fixed top-0 left-0 h-full w-80 glass border-r border-gray-800 z-50 transform -translate-x-full transition-transform duration-300 ease-in-out flex flex-col p-4">
        <div class="flex justify-between items-center mb-6 pb-2 border-b border-gray-800">
            <h2 class="text-lg font-semibold text-white flex items-center gap-2">
                <span>💬</span> История чатов
            </h2>
            <button id="btn-close-sidebar" class="text-gray-400 hover:text-white p-1 text-xl cursor-pointer">✕</button>
        </div>
        
        <div id="chats-list" class="flex-1 space-y-2 overflow-y-auto pr-1">
            <!-- Список чатов -->
        </div>
    </aside>

    <!-- Верхняя шапка (Header) -->
    <header class="px-6 py-4 flex justify-between items-center border-b border-gray-800/80 z-10 glass">
        <div class="flex items-center space-x-4">
            <button id="btn-open-sidebar" class="text-gray-300 hover:text-white text-xl p-2 rounded-xl bg-gray-800/60 hover:bg-gray-700/60 border border-gray-700/50 transition cursor-pointer">
                ☰
            </button>
            <div class="flex items-center space-x-2.5">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-purple-600 flex items-center justify-center font-extrabold text-white text-lg shadow-lg shadow-indigo-500/30">Z</div>
                <span class="font-bold text-xl text-transparent bg-clip-text bg-gradient-to-r from-white to-gray-400 tracking-wide">Zenith AI</span>
            </div>
        </div>

        <div class="flex items-center space-x-3">
            <button id="btn-header-new-chat" title="Новый чат" class="w-10 h-10 rounded-xl bg-gray-800/60 hover:bg-gray-700/60 border border-gray-700/50 flex items-center justify-center text-gray-200 hover:text-white text-2xl transition cursor-pointer">
                +
            </button>
            <button id="btn-settings" title="Настройки API" class="w-10 h-10 rounded-xl bg-gray-800/60 hover:bg-gray-700/60 border border-gray-700/50 flex items-center justify-center text-gray-200 hover:text-white text-lg transition cursor-pointer">
                ⚙️
            </button>
            <div id="user-badge" class="px-3.5 py-2 rounded-xl bg-indigo-950/80 border border-indigo-600/40 text-indigo-200 text-xs font-semibold shadow-inner">
                👤 Jasur
            </div>
        </div>
    </header>

    <!-- Основной чат -->
    <main class="flex-1 overflow-y-auto p-4 sm:p-6 max-w-4xl w-full mx-auto flex flex-col justify-start z-10">
        <!-- Предупреждение -->
        <div id="warning-banner" class="hidden mb-4 bg-amber-950/50 border border-amber-600/50 text-amber-200 px-4 py-3 rounded-2xl flex items-center justify-between text-xs sm:text-sm backdrop-blur-md">
            <span>⚠️ <b>API ключ не задан.</b> Нажмите на шестерёнку (⚙️), чтобы вставить бесплатный ключ Gemini.</span>
            <button id="btn-configure-warning" class="bg-amber-600/30 hover:bg-amber-600/50 px-3 py-1 rounded-lg text-white font-medium ml-2 transition cursor-pointer">Настроить</button>
        </div>

        <!-- Окно сообщений -->
        <div id="messages-container" class="space-y-4 w-full pt-2">
            <!-- Сообщения добавляются здесь -->
        </div>
    </main>

    <!-- Поле ввода -->
    <footer class="p-4 glass border-t border-gray-800/80 z-10">
        <div class="max-w-3xl mx-auto space-y-2">
            <div class="relative flex items-center">
                <input type="text" id="chat-input" placeholder="Задайте вопрос Zenith AI..." class="w-full bg-gray-900/90 border border-gray-700/80 rounded-2xl px-5 py-4 pr-14 text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 text-sm transition shadow-inner">
                <button id="btn-send" class="absolute right-3 bg-indigo-600 hover:bg-indigo-500 text-white w-9 h-9 rounded-xl flex items-center justify-center text-base transition shadow-md shadow-indigo-600/30 cursor-pointer">
                    ➔
                </button>
            </div>
            <p class="text-[11px] text-center text-gray-500">Zenith AI автоматически распознаёт язык вашего сообщения.</p>
        </div>
    </footer>

    <!-- Настройки Modal -->
    <div id="modal-settings" class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 hidden z-50 backdrop-blur-md">
        <div class="glass max-w-md w-full p-6 rounded-2xl space-y-4 border border-gray-700/80 shadow-2xl">
            <h3 class="text-lg font-semibold text-white flex items-center gap-2">⚙️ Настройки Gemini API</h3>
            <p class="text-xs text-gray-400">Получите бесплатный API ключ в пару кликов на <a href="https://aistudio.google.com/app/apikey" target="_blank" class="text-indigo-400 underline hover:text-indigo-300">Google AI Studio</a>.</p>
            <input type="password" id="input-api-key" placeholder="Вставьте ваш API ключ (AIzaSy...)" class="w-full bg-gray-950 border border-gray-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-indigo-500">
            <div class="flex justify-end space-x-2 pt-2">
                <button id="btn-save-settings" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-medium transition cursor-pointer shadow-lg shadow-indigo-600/30">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        let apiKey = localStorage.getItem('zenith_api_key') || '';
        let rawChats = JSON.parse(localStorage.getItem('zenith_chats')) || [];
        
        // Очищаем старые сломанные чаты с undefined
        let chats = rawChats.filter(c => c && typeof c === 'object' && c.id && c.title && Array.isArray(c.messages));
        let activeChatId = localStorage.getItem('zenith_active_chat_id') || null;

        const elApiKeyInput = document.getElementById('input-api-key');
        const elModalSettings = document.getElementById('modal-settings');
        const elWarningBanner = document.getElementById('warning-banner');
        const elChatInput = document.getElementById('chat-input');
        const elBtnSend = document.getElementById('btn-send');
        const elMessagesContainer = document.getElementById('messages-container');
        const elChatsList = document.getElementById('chats-list');

        const elSidebar = document.getElementById('sidebar');
        const elSidebarOverlay = document.getElementById('sidebar-overlay');

        elApiKey
