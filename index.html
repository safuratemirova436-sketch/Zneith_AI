<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenith AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body { background-color: #0b0f19; color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; }
        .glass { background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .chat-active { background: rgba(99, 102, 241, 0.2); border-color: rgba(99, 102, 241, 0.4); }
    </style>
</head>
<body class="h-screen flex overflow-hidden">

    <!-- Sidebar (История чатов) -->
    <aside class="w-64 glass flex flex-col justify-between p-4 border-r border-gray-800 z-20">
        <div>
            <!-- Логотип и Название -->
            <div class="flex items-center space-x-3 mb-6 px-2">
                <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-500/30">Z</div>
                <span class="font-bold text-xl text-indigo-400">Zenith AI</span>
            </div>

            <!-- Кнопка "Новый чат" -->
            <button id="btn-new-chat" class="w-full py-2.5 px-4 mb-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-sm flex items-center justify-center space-x-2 transition shadow-md cursor-pointer">
                <span class="text-lg">+</span>
                <span>Новый чат</span>
            </button>

            <!-- Список сохраненных чатов -->
            <div class="space-y-1">
                <p class="text-xs font-semibold text-gray-500 px-2 mb-2 uppercase tracking-wider">История диалогов</p>
                <div id="chats-list" class="space-y-1 max-h-[calc(100vh-280px)] overflow-y-auto pr-1">
                    <!-- Диалоги будут добавляться сюда -->
                </div>
            </div>
        </div>

        <!-- Нижний блок: Настройки и Google Профиль -->
        <div class="space-y-3 pt-4 border-t border-gray-800">
            <button id="btn-settings" class="w-full py-2 px-3 rounded-lg bg-gray-800 hover:bg-gray-700 text-sm text-gray-300 flex items-center space-x-2 transition cursor-pointer">
                <span>⚙️</span>
                <span>Настройки API</span>
            </button>

            <!-- Блок Google Авторизации -->
            <div id="auth-container" class="pt-2">
                <div id="g_id_onload"
                    data-client_id="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
                    data-callback="handleCredentialResponse"
                    data-auto_prompt="false">
                </div>
                <div id="google-btn-wrapper" class="w-full flex justify-center">
                    <div class="g_id_signin" data-type="standard" data-theme="filled_dark" data-size="medium" data-shape="pill"></div>
                </div>
                <div id="user-profile" class="hidden flex items-center justify-between bg-gray-900/80 p-2 rounded-xl border border-gray-800">
                    <div class="flex items-center space-x-2 overflow-hidden">
                        <img id="user-avatar" class="w-7 h-7 rounded-full border border-indigo-500" src="" alt="avatar">
                        <span id="user-name" class="text-xs text-gray-200 truncate font-medium">Пользователь</span>
                    </div>
                    <button id="btn-logout" class="text-xs text-red-400 hover:text-red-300 px-2 py-1 rounded cursor-pointer">Выйти</button>
                </div>
            </div>
        </div>
    </aside>

    <!-- Основная область чата -->
    <main class="flex-1 flex flex-col justify-between relative bg-slate-950">
        <!-- Шапка текущего чата -->
        <header class="glass px-6 py-3 flex justify-between items-center border-b border-gray-800">
            <h2 id="current-chat-title" class="font-medium text-gray-200 text-sm truncate">Новый диалог</h2>
            <button id="btn-clear-chat" class="text-xs text-gray-400 hover:text-red-400 transition cursor-pointer">🗑️ Очистить чат</button>
        </header>

        <!-- Окно сообщений -->
        <div id="messages-container" class="flex-1 overflow-y-auto p-6 space-y-4 max-w-3xl w-full mx-auto">
            <div class="flex justify-start">
                <div class="glass rounded-2xl px-4 py-3 text-sm text-gray-200 max-w-[80%]">
                    Привет! Нажмите на «⚙️ Настройки API», введите ваш ключ Gemini, и мы сможем начать общение. Вы также можете создавать новые чаты в меню слева.
                </div>
            </div>
        </div>

        <!-- Поле ввода -->
        <div class="p-4 glass border-t border-gray-800">
            <div class="max-w-3xl mx-auto flex space-x-2">
                <input type="text" id="chat-input" placeholder="Спросите о чём угодно..." class="flex-1 bg-gray-900/90 border border-gray-700/80 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500 text-sm transition">
                <button id="btn-send" class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 rounded-xl font-medium cursor-pointer transition shadow-lg shadow-indigo-600/20">Отправить</button>
            </div>
        </div>
    </main>

    <!-- Модальное окно Настроек -->
    <div id="modal-settings" class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 hidden z-50 backdrop-blur-sm">
        <div class="glass max-w-md w-full p-6 rounded-2xl space-y-4 bg-gray-900">
            <h3 class="text-lg font-semibold text-white">⚙️ Настройки Gemini API</h3>
            <p class="text-xs text-gray-400">Получите бесплатный ключ на странице <a href="https://aistudio.google.com/app/apikey" target="_blank" class="text-indigo-400 underline">Google AI Studio</a>.</p>
            <input type="password" id="input-api-key" placeholder="Вставьте ключ AIzaSy..." class="w-full bg-gray-950 border border-gray-700 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-indigo-500">
            <div class="flex justify-end space-x-2 pt-2">
                <button id="btn-save-settings" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-sm font-medium cursor-pointer">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- JS Логика (Чаты, Хранение, API) -->
    <script>
        // Переменные состояния
        let apiKey = localStorage.getItem('zenith_api_key') || '';
        let chats = JSON.parse(localStorage.getItem('zenith_chats')) || [];
        let activeChatId = localStorage.getItem('zenith_active_chat_id') || null;

        const elApiKeyInput = document.getElementById('input-api-key');
        const elModalSettings = document.getElementById('modal-settings');
        const elChatInput = document.getElementById('chat-input');
        const elBtnSend = document.getElementById('btn-send');
        const elMessagesContainer = document.getElementById('messages-container');
        const elChatsList = document.getElementById('chats-list');
        const elCurrentTitle = document.getElementById('current-chat-title');

        elApiKeyInput.value = apiKey;

        // Модели Gemini
        const MODELS = ['gemini-2.5-flash', 'gemini-2.0-flash', 'gemini-1.5-flash-latest'];

        // Инициализация
        function init() {
            if (chats.length === 0) {
                createNewChat();
            } else {
                if (!activeChatId || !chats.find(c => c.id === activeChatId)) {
                    activeChatId = chats[0].id;
                }
                renderChatsList();
                renderMessages();
            }
        }

        // Создание нового чата
        function createNewChat() {
            const newChat = {
                id: 'chat_' + Date.now(),
                title: 'Новый чат',
                messages: []
            };
            chats.unshift(newChat);
            activeChatId = newChat.id;
            saveChats();
            renderChatsList();
            renderMessages();
        }

        // Сохранение в LocalStorage
        function saveChats() {
            localStorage.setItem('zenith_chats', JSON.stringify(chats));
            localStorage.setItem('zenith_active_chat_id', activeChatId);
        }

        // Отрисовка списка чатов в сайдбаре
        function renderChatsList() {
            elChatsList.innerHTML = '';
            chats.forEach(chat => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left px-3 py-2 rounded-lg text-xs font-medium truncate flex items-center justify-between border cursor-pointer transition ${chat.id === activeChatId ? 'chat-active text-indigo-300 border-indigo-500/40' : 'text-gray-400 hover:bg-gray-800/60 border-transparent'}`;
                btn.innerText = chat.title;
                btn.onclick = () => {
                    activeChatId = chat.id;
                    saveChats();
                    renderChatsList();
                    renderMessages();
                };
                elChatsList.appendChild(btn);
            });
        }

        // Отрисовка сообщений активного чата
        function renderMessages() {
            const activeChat = chats.find(c => c.id === activeChatId);
            if (!activeChat) return;

            elCurrentTitle.innerText = activeChat.title;
            elMessagesContainer.innerHTML = '';

            if (activeChat.messages.length === 0) {
                elMessagesContainer.innerHTML = `
                    <div class="flex justify-start">
                        <div class="glass rounded-2xl px-4 py-3 text-sm text-gray-200 max-w-[80%]">
                            Этот чат пока пуст. Задайте любой вопрос!
                        </div>
                    </div>`;
                return;
            }

            activeChat.messages.forEach(msg => {
                appendMessageToDOM(msg.role, msg.text);
            });
            elMessagesContainer.scrollTop = elMessagesContainer.scrollHeight;
        }

        function appendMessageToDOM(role, text) {
            const div = document.createElement('div');
            div.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'}`;
            
            const bubble = document.createElement('div');
            bubble.className = `max-w-[80%] rounded-2xl px-4 py-3 text-sm ${role === 'user' ? 'bg-indigo-600 text-white' : 'glass text-gray-200'}`;
            bubble.innerText = text;

            div.appendChild(bubble);
            elMessagesContainer.appendChild(div);
            elMessagesContainer.scrollTop = elMessagesContainer.scrollHeight;
        }

        // Запрос к Gemini
        async function fetchGeminiResponse(text) {
            let lastError = null;
            for (const model of MODELS) {
                try {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: text }] }] })
                    });
                    const data = await res.json();
                    if (res.ok && data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
                        return data.candidates[0].content.parts[0].text;
                    }
                    if (data.error) lastError = data.error.message;
                } catch (e) {
                    lastError = e.message;
                }
            }
            throw new Error(lastError || 'Ошибка соединения с API Gemini.');
        }

        // Отправка сообщения
        async function sendMessage() {
            const text = elChatInput.value.trim();
            if (!text) return;

            if (!apiKey) {
                elModalSettings.classList.remove('hidden');
                alert('Сначала введите API ключ!');
                return;
            }

            const activeChat = chats.find(c => c.id === activeChatId);
            if (!activeChat) return;

            // Название чата по первому сообщению
            if (activeChat.messages.length === 0) {
                activeChat.title = text.slice(0, 25) + (text.length > 25 ? '...' : '');
                renderChatsList();
            }

            activeChat.messages.push({ role: 'user', text: text });
            saveChats();
            renderMessages();
            elChatInput.value = '';

            // Сообщение ожидания
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'flex justify-start';
            loadingDiv.innerHTML = `<div class="glass rounded-2xl px-4 py-3 text-sm text-indigo-300 animate-pulse">Zenith AI думает...</div>`;
            elMessagesContainer.appendChild(loadingDiv);
            elMessagesContainer.scrollTop = elMessagesContainer.scrollHeight;

            try {
                const reply = await fetchGeminiResponse(text);
                loadingDiv.remove();
                activeChat.messages.push({ role: 'assistant', text: reply });
                saveChats();
                renderMessages();
            } catch (err) {
                loadingDiv.remove();
                activeChat.messages.push({ role: 'assistant', text: 'Ошибка: ' + err.message });
                saveChats();
                renderMessages();
            }
        }

        // События
        document.getElementById('btn-new-chat').onclick = createNewChat;
        document.getElementById('btn-settings').onclick = () => elModalSettings.classList.remove('hidden');
        
        document.getElementById('btn-save-settings').onclick = () => {
            apiKey = elApiKeyInput.value.trim();
            localStorage.setItem('zenith_api_key', apiKey);
            elModalSettings.classList.add('hidden');
            alert('Ключ сохранен!');
        };

        document.getElementById('btn-clear-chat').onclick = () => {
            const activeChat = chats.find(c => c.id === activeChatId);
            if (activeChat) {
                activeChat.messages = [];
                saveChats();
                renderMessages();
            }
        };

        elBtnSend.onclick = sendMessage;
        elChatInput.onkeydown = (e) => { if (e.key === 'Enter') sendMessage(); };

        // Авторизация Google (Обработка ответа)
        function parseJwt(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                return JSON.parse(window.atob(base64));
            } catch (e) { return null; }
        }

        window.handleCredentialResponse = function(response) {
            const payload = parseJwt(response.credential);
            if (payload) {
                document.getElementById('google-btn-wrapper').classList.add('hidden');
                document.getElementById('user-profile').classList.remove('hidden');
                document.getElementById('user-avatar').src = payload.picture || '';
                document.getElementById('user-name').innerText = payload.name || 'Пользователь';
            }
        };

        document.getElementById('btn-logout').onclick = () => {
            document.getElementById('google-btn-wrapper').classList.remove('hidden');
            document.getElementById('user-profile').classList.add('hidden');
        };

        // Старт
        init();
    </script>
</body>
</html>
