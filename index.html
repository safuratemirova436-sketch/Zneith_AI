<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenith AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background-color: #080b12; 
            color: #f1f5f9; 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }

        /* Динамический анимированный фон */
        .bg-glow-1 {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.2) 0%, rgba(0, 0, 0, 0) 70%);
            top: -100px;
            left: -100px;
            border-radius: 50%;
            animation: pulseGlow 8s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: 0;
        }
        .bg-glow-2 {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            bottom: -150px;
            right: -150px;
            border-radius: 50%;
            animation: pulseGlow 10s ease-in-out infinite alternate-reverse;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1) translate(0, 0); opacity: 0.6; }
            50% { transform: scale(1.2) translate(30px, -20px); opacity: 0.9; }
            100% { transform: scale(0.9) translate(-20px, 30px); opacity: 0.5; }
        }

        /* Стильный скроллбар */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(99, 102, 241, 0.5); }

        /* Эффект матового стекла */
        .glass { 
            background: rgba(15, 23, 42, 0.75); 
            backdrop-filter: blur(16px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
        }
        .glass-card { 
            background: rgba(30, 41, 59, 0.5); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.07); 
        }
        .glass-card:hover {
            border-color: rgba(99, 102, 241, 0.4);
            background: rgba(30, 41, 59, 0.8);
        }

        .chat-active { 
            background: rgba(99, 102, 241, 0.25) !important; 
            border: 1px solid rgba(129, 140, 248, 0.5) !important; 
            color: #fff !important;
        }
        .chat-item:hover .btn-delete-chat { opacity: 1; }
    </style>
</head>
<body class="h-screen flex flex-col justify-between relative">

    <!-- Динамические неоновые пятна -->
    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <!-- Выдвижная боковая панель (История чатов) -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/70 z-40 hidden backdrop-blur-sm transition-opacity"></div>
    <aside id="sidebar" class="fixed top-0 left-0 h-full w-80 glass border-r border-slate-800 z-50 transform -translate-x-full transition-transform duration-300 ease-in-out flex flex-col p-4">
        <div class="flex justify-between items-center mb-6 pb-3 border-b border-slate-800">
            <h2 class="text-base font-semibold text-white flex items-center gap-2">
                <span>💬</span> История чатов
            </h2>
            <button id="btn-close-sidebar" class="text-slate-400 hover:text-white p-1 text-lg cursor-pointer">✕</button>
        </div>
        
        <div id="chats-list" class="flex-1 space-y-2 overflow-y-auto pr-1">
            <!-- Список чатов -->
        </div>
    </aside>

    <!-- Верхняя шапка (Header) -->
    <header class="px-6 py-4 flex justify-between items-center z-10 glass border-b border-slate-800/80">
        <div class="flex items-center space-x-4">
            <button id="btn-open-sidebar" class="text-slate-300 hover:text-white text-lg p-2 rounded-xl bg-slate-800/60 hover:bg-slate-700/60 border border-slate-700/50 transition cursor-pointer">
                ☰
            </button>
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-purple-600 flex items-center justify-center font-extrabold text-white text-lg shadow-lg shadow-indigo-500/30">Z</div>
                <span class="font-bold text-xl text-transparent bg-clip-text bg-gradient-to-r from-white via-slate-200 to-indigo-200 tracking-wide">Zenith AI</span>
            </div>
        </div>

        <div class="flex items-center space-x-2.5">
            <button id="btn-header-new-chat" title="Новый чат" class="w-9 h-9 rounded-xl bg-indigo-600/80 hover:bg-indigo-500 border border-indigo-400/30 flex items-center justify-center text-white text-xl transition cursor-pointer shadow-md shadow-indigo-600/20">
                +
            </button>
            <button id="btn-settings" title="Настройки API" class="w-9 h-9 rounded-xl bg-slate-800/80 hover:bg-slate-700 border border-slate-700 flex items-center justify-center text-slate-200 hover:text-white text-base transition cursor-pointer">
                ⚙️
            </button>
            <div id="user-badge" class="px-3.5 py-1.5 rounded-xl bg-indigo-950/90 border border-indigo-500/40 text-indigo-200 text-xs font-semibold shadow-inner">
                👤 Jasur
            </div>
        </div>
    </header>

    <!-- Основная область чата -->
    <main class="flex-1 overflow-y-auto p-4 sm:p-6 max-w-4xl w-full mx-auto flex flex-col justify-start z-10">
        <!-- Баннер отсутствия ключа -->
        <div id="warning-banner" class="hidden mb-4 bg-amber-950/60 border border-amber-500/50 text-amber-200 px-4 py-3 rounded-2xl flex items-center justify-between text-xs sm:text-sm backdrop-blur-md shadow-lg">
            <span>⚠️ <b>API ключ не задан.</b> Добавьте ваш бесплатный ключ Gemini в настройках.</span>
            <button id="btn-configure-warning" class="bg-amber-500/20 hover:bg-amber-500/40 px-3 py-1 rounded-lg text-amber-100 font-medium ml-2 transition cursor-pointer">Настроить</button>
        </div>

        <!-- Окно сообщений -->
        <div id="messages-container" class="space-y-4 w-full pt-2">
            <!-- Сообщения -->
        </div>
    </main>

    <!-- Поле ввода -->
    <footer class="p-4 glass border-t border-slate-800/80 z-10">
        <div class="max-w-3xl mx-auto space-y-2">
            <div class="relative flex items-center">
                <input type="text" id="chat-input" placeholder="Задайте вопрос Zenith AI..." class="w-full bg-slate-900/90 border border-slate-700/80 rounded-2xl px-5 py-4 pr-14 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 text-sm transition shadow-inner">
                <button id="btn-send" class="absolute right-3 bg-indigo-600 hover:bg-indigo-500 text-white w-9 h-9 rounded-xl flex items-center justify-center text-base transition shadow-md shadow-indigo-600/30 cursor-pointer">
                    ➔
                </button>
            </div>
            <p class="text-[11px] text-center text-slate-500">Zenith AI автоматически распознаёт язык вашего сообщения.</p>
        </div>
    </footer>

    <!-- Модальное окно Настроек -->
    <div id="modal-settings" class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 hidden z-50 backdrop-blur-md">
        <div class="glass max-w-md w-full p-6 rounded-2xl space-y-4 border border-slate-700 shadow-2xl">
            <h3 class="text-lg font-semibold text-white flex items-center gap-2">⚙️ Настройки Gemini API</h3>
            <p class="text-xs text-slate-400">Получите бесплатный ключ в <a href="https://aistudio.google.com/app/apikey" target="_blank" class="text-indigo-400 underline hover:text-indigo-300">Google AI Studio</a>.</p>
            <input type="password" id="input-api-key" placeholder="Вставьте API ключ (AIzaSy...)" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-indigo-500">
            <div class="flex justify-end space-x-2 pt-2">
                <button id="btn-save-settings" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-medium transition cursor-pointer shadow-lg shadow-indigo-600/30">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- Полная логика скрипта -->
    <script>
        let apiKey = localStorage.getItem('zenith_api_key') || '';
        let rawChats = JSON.parse(localStorage.getItem('zenith_chats')) || [];
        
        // Очистка памяти от возможного мусора и undefined
        let chats = Array.isArray(rawChats) ? rawChats.filter(c => c && typeof c === 'object' && c.id && c.title && Array.isArray(c.messages)) : [];
        let activeChatId = localStorage.getItem('zenith_active_chat_id') || null;

        const elApiKeyInput = document.getElementById('input-api-key');
        const elModalSettings = document.getElementById('modal-settings');
        const elWarningBanner = document.getElementById('warning-banner');
        const elChatInput = document.getElementById('chat-input');
        const elBtnSend = document.getElementById('btn-send');
        const elMessagesContainer = document.getElementById('messages-container');
        const elChatsList = document.getElementById('chats-list');

        const elSidebar = document.getElementById('sidebar');
        const elSidebarOverlay = document.getElementById('sidebar-overlay');

        elApiKeyInput.value = apiKey;
        const MODELS = ['gemini-2.5-flash', 'gemini-2.0-flash', 'gemini-1.5-flash-latest'];

        function updateApiKeyWarning() {
            if (!apiKey) {
                elWarningBanner.classList.remove('hidden');
            } else {
                elWarningBanner.classList.add('hidden');
            }
        }

        function init() {
            updateApiKeyWarning();
            if (chats.length === 0) {
                createNewChat();
            } else {
                if (!activeChatId || !chats.find(c => c.id === activeChatId)) {
                    activeChatId = chats[0].id;
                }
                saveChats();
                renderChatsList();
                renderMessages();
            }
        }

        function createNewChat() {
            const newChat = {
                id: 'chat_' + Date.now(),
                title: 'Новый диалог',
                messages: []
            };
            chats.unshift(newChat);
            activeChatId = newChat.id;
            saveChats();
            renderChatsList();
            renderMessages();
            closeSidebar();
        }

        function deleteChat(chatId, e) {
            e.stopPropagation();
            chats = chats.filter(c => c.id !== chatId);
            if (chats.length === 0) {
                createNewChat();
            } else {
                if (activeChatId === chatId) {
                    activeChatId = chats[0].id;
                }
                saveChats();
                renderChatsList();
                renderMessages();
            }
        }

        function saveChats() {
            localStorage.setItem('zenith_chats', JSON.stringify(chats));
            localStorage.setItem('zenith_active_chat_id', activeChatId);
        }

        function renderChatsList() {
            elChatsList.innerHTML = '';
            chats.forEach(chat => {
                const container = document.createElement('div');
                const isActive = chat.id === activeChatId;
                container.className = `chat-item group w-full px-4 py-3 rounded-xl text-sm font-medium flex items-center justify-between cursor-pointer transition ${isActive ? 'chat-active' : 'glass-card text-slate-300'}`;
                
                const titleSpan = document.createElement('span');
                titleSpan.className = 'truncate flex-1 pr-2';
                titleSpan.innerText = chat.title || 'Новый диалог';

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'btn-delete-chat opacity-0 hover:text-red-400 text-slate-400 transition p-1 cursor-pointer';
                deleteBtn.title = 'Удалить';
                deleteBtn.innerHTML = '🗑️';
                deleteBtn.onclick = (e) => deleteChat(chat.id, e);

                container.appendChild(titleSpan);
                container.appendChild(deleteBtn);

                container.onclick = () => {
                    activeChatId = chat.id;
                    saveChats();
                    renderChatsList();
                    renderMessages();
                    closeSidebar();
                };

                elChatsList.appendChild(container);
            });
        }

        window.sendQuickPrompt = function(text) {
            elChatInput.value = text;
            sendMessage();
        };

        function renderMessages() {
            const activeChat = chats.find(c => c.id === activeChatId);
            if (!activeChat) return;

            elMessagesContainer.innerHTML = '';

            if (!activeChat.messages || activeChat.messages.length === 0) {
                elMessagesContainer.innerHTML = `
                    <div class="space-y-6 pt-4">
                        <div class="flex justify-start">
                            <div class="glass border border-slate-800 rounded-2xl px-5 py-4 text-sm text-slate-200 max-w-[85%] shadow-xl">
                                Здравствуйте, Jasur! Чем я могу помочь вам сегодня? ✨
                            </div>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-4">
                            <div onclick="window.sendQuickPrompt('Придумай 3 идеи для проекта')" class="glass-card p-4 rounded-2xl cursor-pointer transition group">
                                <div class="text-indigo-400 text-lg mb-1">💡 Идеи</div>
                                <div class="text-xs text-slate-400 group-hover:text-slate-200">Придумать идеи для проекта</div>
                            </div>
                            <div onclick="window.sendQuickPrompt('Напиши простой сайт на HTML/CSS')" class="glass-card p-4 rounded-2xl cursor-pointer transition group">
                                <div class="text-indigo-400 text-lg mb-1">💻 Кодинг</div>
                                <div class="text-xs text-slate-400 group-hover:text-slate-200">Написать код приложения</div>
                            </div>
                            <div onclick="window.sendQuickPrompt('Расскажи интересные факты про космос')" class="glass-card p-4 rounded-2xl cursor-pointer transition group">
                                <div class="text-indigo-400 text-lg mb-1">📚 Интересно</div>
                                <div class="text-xs text-slate-400 group-hover:text-slate-200">Рассказать что-то новое</div>
                            </div>
                        </div>
                    </div>`;
                return;
            }

            activeChat.messages.forEach(msg => {
                appendMessageToDOM(msg.role, msg.text);
            });
            elMessagesContainer.scrollTop = elMessagesContainer.scrollHeight;
        }

        function copyToClipboard(text, btn) {
            navigator.clipboard.writeText(text);
            btn.innerText = '✓ Скопировано';
            setTimeout(() => btn.innerText = '📋 Копировать', 2000);
        }

        function appendMessageToDOM(role, text) {
            const div = document.createElement('div');
            div.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'}`;
            
            const wrapper = document.createElement('div');
            wrapper.className = `max-w-[85%] rounded-2xl px-5 py-4 text-sm relative group ${role === 'user' ? 'bg-gradient-to-r from-indigo-600 to-indigo-700 text-white shadow-lg shadow-indigo-600/20' : 'glass border border-slate-800 text-slate-200 shadow-xl'}`;
            
            const p = document.createElement('div');
            p.className = 'whitespace-pre-wrap leading-relaxed';
            p.innerText = text;
            wrapper.appendChild(p);

            if (role === 'assistant') {
                const copyBtn = document.createElement('button');
                copyBtn.className = 'mt-2 text-[11px] text-slate-400 hover:text-indigo-300 transition cursor-pointer flex items-center gap-1 opacity-80';
                copyBtn.innerText = '📋 Копировать';
                copyBtn.onclick = () => copyToClipboard(text, copyBtn);
                wrapper.appendChild(copyBtn);
            }

            div.appendChild(wrapper);
            elMessagesContainer.appendChild(div);
            elMessagesContainer.scrollTop = elMessagesContainer.scrollHeight;
        }

        async function fetchGeminiResponse(text) {
            let lastError = null;
            for (const model of MODELS) {
                try {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: text }] }] })
                    });
                    const data = await res.json();
                    if (res.ok && data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
                        return data.candidates[0].content.parts[0].text;
                    }
                    if (data.error) lastError = data.error.message;
                } catch (e) {
                    lastError = e.message;
                }
            }
            throw new Error(lastError || 'Ошибка соединения с API.');
        }

        async function sendMessage() {
            const text = elChatInput.value.trim();
            if (!text) return;

            if (!apiKey) {
                elModalSettings.classList.remove('hidden');
                return;
            }

            const activeChat = chats.find(c => c.id === activeChatId);
            if (!activeChat) return;

            if (!activeChat.messages || activeChat.messages.length === 0) {
                activeChat.title = text.slice(0, 22) + (text.length > 22 ? '...' : '');
                renderChatsList();
            }

            activeChat.messages.push({ role: 'user', text: text });
            saveChats();
            renderMessages();
            elChatInput.value = '';

            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'flex justify-start';
            loadingDiv.innerHTML = `<div class="glass border border-slate-800 rounded-2xl px-5 py-3.5 text-sm text-indigo-400 animate-pulse flex items-center gap-2"><span>✨ Zenith AI думает...</span></div>`;
            elMessagesContainer.appendChild(loadingDiv);
            elMessagesContainer.scrollTop = elMessagesContainer.scrollHeight;

            try {
                const reply = await fetchGeminiResponse(text);
                loadingDiv.remove();
                activeChat.messages.push({ role: 'assistant', text: reply });
                saveChats();
                renderMessages();
            } catch (err) {
                loadingDiv.remove();
                activeChat.messages.push({ role: 'assistant', text: 'Ошибка: ' + err.message });
                saveChats();
                renderMessages();
            }
        }

        function openSidebar() {
            elSidebar.classList.remove('-translate-x-full');
            elSidebarOverlay.classList.remove('hidden');
        }

        function closeSidebar() {
            elSidebar.classList.add('-translate-x-full');
            elSidebarOverlay.classList.add('hidden');
        }

        document.getElementById('btn-open-sidebar').onclick = openSidebar;
        document.getElementById('btn-close-sidebar').onclick = closeSidebar;
        elSidebarOverlay.onclick = closeSidebar;

        document.getElementById('btn-header-new-chat').onclick = createNewChat;
        document.getElementById('btn-settings').onclick = () => elModalSettings.classList.remove('hidden');
        document.getElementById('btn-configure-warning').onclick = () => elModalSettings.classList.remove('hidden');
        
        document.getElementById('btn-save-settings').onclick = () => {
            apiKey = elApiKeyInput.value.trim();
            localStorage.setItem('zenith_api_key', apiKey);
            elModalSettings.classList.add('hidden');
            updateApiKeyWarning();
        };

        elBtnSend.onclick = sendMessage;
        elChatInput.onkeydown = (e) => { if (e.key === 'Enter') sendMessage(); };

        init();
    </script>
</body>
</html>
